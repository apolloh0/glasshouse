<!doctype html>
<html>
<head><meta charset="utf-8"><title>glasshouse debug</title></head>
<body>
  <!-- T11: deliberately ugly. Do not spend a minute styling this. -->
  <textarea id="src" rows="18" cols="60"></textarea>
  <div>
    seed <input id="seed" type="number" value="42">
    <button id="run">Run</button>
    <button id="pause">Pause</button>
  </div>
  <canvas id="stage" width="320" height="240" style="border:1px solid #000"></canvas>
  <div>frame <input id="frame" type="range" min="0" max="0" value="0" style="width:320px"> <span id="frameN"></span></div>
  <div>step <input id="step" type="range" min="0" max="0" value="0" style="width:320px"> <span id="stepInfo"></span></div>
  <pre id="err"></pre>
  <script type="module" src="./main.ts"></script>
</body>
</html>
